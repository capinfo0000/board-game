="18">ホーム</a> <h1><img src="assets/icons/yen-banknote.svg" alt="" width="26" height="26">家計簿</h1> <div class="head-actions"> <button type="button" class="sfx-btn" id="sfxToggle" aria-pressed="true" aria-label="効果音：オン" title="効果音のオン/オフ"><img src="assets/icons/speaker-high-volume.svg" alt="" width="22" height="22"></button> <button class="icon-btn" id="settingsToggle" aria-expanded="false" aria-controls="settingsCard">設定</button> </div> </header> <nav class="month-nav" aria-label="月の切替"> <button id="prevMonth" type="button">‹ 前月</button> <div class="month-label" id="monthLabel"></div> <button id="nextMonth" type="button">次月 ›</button> </nav> <section class="card" aria-label="月間サマリー"> <div class="summary"> <div class="stat income"><div class="label"><img src="assets/icons/money-bag.svg" alt="" width="16" height="16">収入</div><div class="value" id="sumIncome">¥0</div></div> <div class="stat expense"><div class="label"><img src="assets/icons/receipt.svg" alt="" width="16" height="16">支出</div><div class="value" id="sumExpense">¥0</div></div> <div class="stat balance"><div class="label"><img src="assets/icons/coin.svg" alt="" width="16" height="16">収支</div><div class="value" id="sumBalance">¥0</div></div> </div> <div id="budgetBlock" style="margin-top:14px"> <div class="budget-row"> <span style="font-size:13px;color:var(--muted);font-weight:600">予算</span> <span class="amt" id="budgetText">未設定</span> </div> <div class="progress" id="budgetProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div style="width:0%"></div></div> <div class="budget-note" id="budgetNote"></div> <div id="budgetAlert"></div> </div> </section> <section class="card" id="settingsCard" hidden aria-label="設定"> <h2><img src="assets/icons/card-index-dividers.svg" alt="" width="22" height="22">設定</h2> <div class="settings-grid"> <div class="field" style="margin:0"> <label for="budgetInput">月間予算（円）</label> <div class="amount-wrap"><span class="yen">¥</span><input id="budgetInp
