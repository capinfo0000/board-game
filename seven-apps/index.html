<!doctype html> <html lang="ja"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>7 Apps</title> <meta name="description" content="ジャンルの違う7つの便利ミニアプリ。データは端末内に保存されます。"> <link rel="icon" href="assets/icons/mobile-phone.svg" type="image/svg+xml"> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet"> <style>:root{--bg:#f4f5fb;--card:#fff;--text:#1b1f3a;--sub:#6b7190;--line:#e6e8f2;--shadow:0 8px 24px rgba(30,40,100,.08)}@media(prefers-color-scheme:dark){:root{--bg:#11142c;--card:#1c2045;--text:#fff;--sub:#b3b9e3;--line:#2a3063;--shadow:0 8px 24px rgba(0,0,0,.35)}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"M PLUS Rounded 1c",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 20px;overflow-x:hidden}.hero{text-align:center;margin-bottom:22px}.hero .stack{display:flex;justify-content:center;margin-bottom:8px}.hero .stack img{width:44px;height:44px;margin:0 -5px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}.hero .stack img:nth-child(2){animation-delay:.3s}.hero .stack img:nth-child(3){animation-delay:.6s}@keyframes bob{50%{transform:translateY(-5px)}}h1{margin:4px 0;font-size:28px;font-weight:800}.hero p{margin:0;color:var(--sub);font-size:14px}.grid{display:grid;gap:12px;width:100%;max-width:460px}a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .15s;animation:rise .45s both}a.card:active{transform:scale(.97)}@keyframes rise{from{opacity:0;transform:translateY(12px)}}.icon{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none}.icon img{width:36px;height:36px}.t{font-size:17px;font-weight:800}.d{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}.chev{margin-left:auto;color:var(--sub);font-size:20px;flex:none}.more{margin-top:20px;width:100%;max-width:460px}.more a{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border-radius:18px;border:1px dashed var(--line);color:var(--text);text-decoration:none;font-weight:700;background:var(--card)}.more img{width:26px;height:26px}footer{margin-top:auto;padding-top:26px;font-size:12px;color:var(--sub);text-align:center;line-height:1.8}footer a{color:inherit}</style> </head> <body> <div class="hero"> <div class="stack"><img src="assets/icons/timer-clock.svg" alt=""><img src="assets/icons/mobile-phone.svg" alt=""><img src="assets/icons/sparkles.svg" alt=""></div> <h1>7 Apps</h1> <p>毎日ちょっと便利な、ジャンル違いのミニアプリ集<br>データはすべてあなたの端末内に保存</p> </div> <div class="grid" id="grid"></div> <div class="more"><a href="https://ad-games-omega.vercel.app"><img src="assets/icons/video-game.svg" alt="">パズルゲーム3本（ぽちっとパズル）はこちら</a></div> <footer><a href="credits.html">素材クレジット</a></footer> <script>var apps=[["pomodoro.html","timer-clock","#ffe3e0","集中タイマー","25分集中＋5分休憩のタイマーとタスク管理"],["kakeibo.html","yen-banknote","#dcf5ee","家計簿","支出をサッと記録、月のグラフで見える化"],["flashcards.html","card-index-dividers","#e3e6ff","単語帳","忘れる前に出題する間隔反復カード"],["habits.html","seedling","#e4f6dc","習慣トラッカー","毎日チェック、連続記録とヒートマップ"],["warikan.html","receipt","#fff0d9","割り勘・精算","飲み会の割り勘と旅行の立替精算"],["notes.html","memo","#f1e8e1","Markdownメモ","タグ・検索・チェックリスト付きメモ帳"],["metronome.html","musical-notes","#ddeeff","メトロノーム＆呼吸","練習用メトロノームと呼吸ガイド"]],g=document.getElementById("grid");apps.forEach(function(e,d){var a=document.createElement("a");a.className="card",a.href=e[0],a.style.animationDelay=.05*d+"s",a.innerHTML='<div class="icon" style="background:'+e[2]+'"><img src="assets/icons/'+e[1]+'.svg" alt=""></div><div><div class="t">'+e[3]+'</div><div class="d">'+e[4]+'</div></div><div class="chev">›</div>',g.appendChild(a)})</script> </body> </html>
